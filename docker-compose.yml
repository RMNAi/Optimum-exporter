services:
  optimum-exporter:
    build: .
    container_name: optimum-exporter
    ports:
      - "127.0.0.1:9188:9188"
    environment:
      - GATEWAY_URL=http://host.docker.internal:48123/api/v1/self_info
      - LISTEN_ADDR=:9188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true