services:
  prometheus:
    image: prom/prometheus:v3.13.3
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.8.0
    command: ["--config.file=/etc/json/config.yml"]
    volumes: ["./json_exporter/config.yml:/etc/json/config.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped