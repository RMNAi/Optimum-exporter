services:
  # 1. Your Optimum Exporter
  optimum-exporter:
    build: .
    container_name: optimum-exporter
    ports:
      - "9100:9100"
    environment:
      # Points to the REAL gateway running on the host machine
      - GATEWAY_URL=http://host.docker.internal:48123/api/v1/self_info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 2. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage: