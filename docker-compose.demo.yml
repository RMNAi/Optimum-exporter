# DEMO ONLY — not for validator hosts. Grafana uses admin/admin.
services:
  optimum-exporter:
    build: .
    ports: ["127.0.0.1:9188:9188"]
    environment:
      - GATEWAY_URL=http://host.docker.internal:48123/api/v1/self_info
      - LISTEN_ADDR=:9188
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/optimum.json:ro
    restart: unless-stopped