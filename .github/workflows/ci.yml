name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker run --rm -v "$PWD/prometheus:/p" --entrypoint /bin/promtool prom/prometheus:v2.53.0 check config /p/prometheus.yml
      - run: docker run --rm -v "$PWD/prometheus:/p" --entrypoint /bin/promtool prom/prometheus:v2.53.0 check rules /p/alerts.yml