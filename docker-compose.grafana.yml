# Production Grafana: no bundled Prometheus. Points at your existing one via env.
services:
  grafana:
    image: grafana/grafana:latest   # pin a digest for real production
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - PROMETHEUS_IS_DEFAULT=${PROMETHEUS_IS_DEFAULT:-false}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning-production:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/optimum-exporter.json:ro
      - ./deploy/native/dashboard.json:/var/lib/grafana/dashboards/optimum-native.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data: