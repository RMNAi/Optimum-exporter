groups:
  - name: optimum-native
    rules:
      - alert: OptimumHealthProbeDown
        expr: probe_success{job="optimum-health-blackbox"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: OptimumBlockFlowStalled
        expr: optimum_health_last_block_age_seconds > 60
        for: 2m
        labels: { severity: warning }
      - alert: OptimumMeshPeersLow
        expr: optimum_selfinfo_mump2p_peers < 3
        for: 5m
        labels: { severity: warning }