modules:
  optimum_health:
    metrics:
      - name: optimum_health_last_block_age_seconds
        path: "{.checks.last_block_age_sec.value}"
        help: Seconds since last block arrived
      - name: optimum_health_mump2p_peers
        path: "{.checks.mump2p_peers.value}"
      - name: optimum_health_uptime_seconds
        path: "{.uptime_seconds}"
  optimum_selfinfo:
    metrics:
      - name: optimum_selfinfo_mump2p_peers
        path: "{.mump2p.total_peers}"