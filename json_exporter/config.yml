modules:
  optimum_health:
    # /health returns 503 when degraded but still serves the JSON body.
    # Accept both, so gauges keep flowing in exactly the states we alert on.
    valid_status_codes: [200, 503]
    metrics:
      - name: optimum_last_block_age_seconds
        path: '{.checks.last_block_age_sec.value}'
        help: Seconds since last block (from /health).
      - name: optimum_mump2p_peers
        path: '{.checks.mump2p_peers.value}'
        help: mump2p mesh peers (from /health).
      - name: optimum_uptime_seconds
        path: '{.uptime_seconds}'
        help: Gateway process uptime seconds (from /health).
      - name: optimum_cl_peers
        path: '{.checks.cl_peers.value}'
        help: CL peers (from /health). Absent on stream-only gateways (check skipped).